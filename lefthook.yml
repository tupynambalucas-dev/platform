# lefthook.yml - tupynambalucas-dev/platform
# Authoritative Git Hook Configuration (Evil Martians Lefthook)

pre-commit:
  parallel: true
  commands:
    lint:
      run: pnpm turbo run lint --filter=[HEAD]
    typecheck:
      run: pnpm turbo run typecheck --filter=[HEAD]
    format:
      glob: "*.{ts,tsx,json,md,css,html}"
      run: npx prettier --write {staged_files}
      stage_fixed: true

commit-msg:
  commands:
    commitlint:
      run: npx --no -- commitlint --edit {1}

pre-push:
  commands:
    prevent-main-push:
      run: |
        BRANCH=$(git branch --show-current)
        if [ "$BRANCH" = "main" ]; then
          echo "[ERROR] Direct push to main branch is strictly blocked."
          exit 1
        fi
