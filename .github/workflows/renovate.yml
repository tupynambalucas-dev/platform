name: Renovate Dependencies

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: 'renovate'
  cancel-in-progress: true

jobs:
  update-dependencies:
    runs-on: ubuntu-latest
    steps:
      - name: Generate CI Bot Token
        id: app-token
        env:
          APP_ID: ${{ secrets.CI_BOT_APP_ID || secrets.CI_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.CI_BOT_APP_PRIVATE_KEY || secrets.CI_APP_PRIVATE_KEY }}
        if: ${{ env.APP_ID != '' && env.APP_PRIVATE_KEY != '' }}
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        with:
          app-id: ${{ env.APP_ID }}
          private-key: ${{ env.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          token: ${{ steps.app-token.outputs.token || secrets.RENOVATE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Execute Renovate Bot
        uses: renovatebot/github-action@v40.0.0
        with:
          configurationFile: shared/git/renovate.json
          token: ${{ steps.app-token.outputs.token || secrets.RENOVATE_TOKEN || secrets.GITHUB_TOKEN }}
