name: Renderer Document Generator

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: 'renderer'
  cancel-in-progress: false

jobs:
  generate-documents:
    runs-on: ubuntu-latest
    steps:
      - name: Generate CI Bot Token
        id: app-token
        env:
          APP_ID: ${{ secrets.CI_BOT_APP_ID || secrets.CI_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.CI_BOT_APP_PRIVATE_KEY || secrets.CI_APP_PRIVATE_KEY }}
        if: ${{ env.APP_ID != '' && env.APP_PRIVATE_KEY != '' }}
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        with:
          app-id: ${{ env.APP_ID }}
          private-key: ${{ env.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref_name || 'main' }}
          token: ${{ secrets.RENDERER_GH_PAT || steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}

      - name: Setup PNPM Environment
        uses: ./.github/actions/setup-pnpm-env
        with:
          node-version: 22
          frozen-lockfile: 'true'
          filter: '@tupynambalucas-dev/renderer...'

      - name: Generate and Publish Documents
        uses: ./.github/actions/generate-renderer
        with:
          github_token: ${{ secrets.RENDERER_GH_PAT || steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          target_branch: ${{ github.event_name == 'workflow_dispatch' && github.ref_name || 'main' }}
