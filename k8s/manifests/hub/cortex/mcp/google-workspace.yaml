# MCP Google Workspace Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-google-workspace
  namespace: cortex
  labels:
    app: mcp-google-workspace
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-google-workspace
  template:
    metadata:
      labels:
        app: mcp-google-workspace
    spec:
      containers:
        - name: mcp-google-workspace
          image: node:22-alpine
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
          args:
            - npx -y @tupynambalucas-dev/mcp-gwork --http
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              memory: '64Mi'
              cpu: '25m'
            limits:
              memory: '256Mi'
              cpu: '200m'
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          env:
            - name: PORT
              value: '8080'
            - name: MCP_TRANSPORT
              value: 'http'
            - name: GOOGLE_SERVICE_ACCOUNT_JSON
              valueFrom:
                secretKeyRef:
                  name: cortex-secrets
                  key: GOOGLE_SERVICE_ACCOUNT_JSON
            - name: NODE_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cortex-secrets
                  key: GITHUB_PACKAGES_TOKEN
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-google-workspace
  namespace: cortex
spec:
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: mcp-google-workspace
