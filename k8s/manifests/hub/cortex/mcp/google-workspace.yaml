# MCP Google Workspace Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-google-workspace
  namespace: cortex
  labels:
    app: mcp-google-workspace
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-google-workspace
  template:
    metadata:
      labels:
        app: mcp-google-workspace
    spec:
      containers:
        - name: mcp-google-workspace
          image: node:22-alpine
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
          args:
            - npx -y @tupynambalucas-dev/cortex-mcp-gwork
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: '64Mi'
              cpu: '25m'
            limits:
              memory: '256Mi'
              cpu: '200m'
          env:
            - name: PORT
              value: '8080'
            - name: GOOGLE_SERVICE_ACCOUNT_JSON
              valueFrom:
                secretKeyRef:
                  name: cortex-secrets
                  key: GOOGLE_SERVICE_ACCOUNT_JSON
                  optional: true
            - name: NODE_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cortex-secrets
                  key: GITHUB_PACKAGES_TOKEN
                  optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-google-workspace
  namespace: cortex
spec:
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: mcp-google-workspace
