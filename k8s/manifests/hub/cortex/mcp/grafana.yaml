# MCP Grafana Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-grafana
  namespace: cortex
  labels:
    app: mcp-grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-grafana
  template:
    metadata:
      labels:
        app: mcp-grafana
    spec:
      containers:
        - name: mcp-grafana
          image: grafana/mcp-grafana:latest
          imagePullPolicy: IfNotPresent
          args:
            - -t
            - streamable-http
            - --address
            - 0.0.0.0:8080
            - -allowed-hosts
            - '*'
            - -allowed-origins
            - '*'
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              memory: '64Mi'
              cpu: '25m'
            limits:
              memory: '256Mi'
              cpu: '200m'
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          env:
            - name: GRAFANA_URL
              valueFrom:
                secretKeyRef:
                  name: cortex-secrets
                  key: GRAFANA_URL
            - name: GRAFANA_BASIC_AUTH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: GRAFANA_ADMIN_USER
            - name: GRAFANA_BASIC_AUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: GRAFANA_ADMIN_PASSWORD
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-grafana
  namespace: cortex
spec:
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: mcp-grafana
