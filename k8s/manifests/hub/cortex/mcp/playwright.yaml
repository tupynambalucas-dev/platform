# MCP Playwright Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-playwright
  namespace: cortex
  labels:
    app: mcp-playwright
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-playwright
  template:
    metadata:
      labels:
        app: mcp-playwright
    spec:
      containers:
        - name: mcp-playwright
          image: mcr.microsoft.com/playwright/mcp:latest
          imagePullPolicy: IfNotPresent
          command:
            - node
            - /app/cli.js
          args:
            - --headless
            - --browser
            - chromium
            - --no-sandbox
            - --port
            - '8080'
            - --host
            - 0.0.0.0
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: '256Mi'
              cpu: '100m'
            limits:
              memory: '1Gi'
              cpu: '500m'
          env:
            - name: PORT
              value: '8080'
            - name: HOST
              value: '0.0.0.0'
            - name: BROWSER
              valueFrom:
                secretKeyRef:
                  name: cortex-secrets
                  key: PLAYWRIGHT_MCP_BROWSER
                  optional: true
            - name: HEADLESS
              value: 'true'
            - name: NO_SANDBOX
              value: 'true'
            - name: ALLOWED_HOSTS
              value: '*'
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-playwright
  namespace: cortex
spec:
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: mcp-playwright
