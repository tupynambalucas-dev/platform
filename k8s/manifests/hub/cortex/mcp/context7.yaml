# MCP Context7 Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-context7
  namespace: cortex
  labels:
    app: mcp-context7
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-context7
  template:
    metadata:
      labels:
        app: mcp-context7
    spec:
      containers:
        - name: mcp-context7
          image: node:22-alpine
          imagePullPolicy: IfNotPresent
          command:
            - npx
            - -y
            - '@upstash/context7-mcp'
          args:
            - '--transport'
            - 'http'
            - '--port'
            - '8080'
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: '64Mi'
              cpu: '25m'
            limits:
              memory: '256Mi'
              cpu: '200m'
          env:
            - name: CONTEXT7_API_KEY
              valueFrom:
                secretKeyRef:
                  name: cortex-secrets
                  key: CONTEXT7_API_KEY
                  optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-context7
  namespace: cortex
spec:
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: mcp-context7
